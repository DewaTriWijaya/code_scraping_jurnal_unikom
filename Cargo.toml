[package]
name = "kotlin_mi_analysis"
version = "0.1.0"
edition = "2021"

[dependencies]
tree-sitter = "0.22"               # versi core parser
tree-sitter-kotlin = "0.3.8"       # grammar Kotlin yang tersedia
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"  # Baris ini yang hilang
walkdir = "2.5"
regex = "1.12.2"
once_cell = "1.21.3"

